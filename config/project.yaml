project:
  name: "E-Commerce Business Intelligence and Decision Support System"
  code: "CS5998"
  timezone: "Asia/Colombo"

paths:
  raw_data: "data/raw"
  staging_data: "data/staging"
  processed_data: "data/processed"
  database: "database/ecommerce_bi.duckdb"
  model_artifacts: "models/artifacts"
  reports: "reports/generated"

data:
  source_name: "Olist Brazilian E-Commerce Public Dataset"
  expected_files:
    - "olist_orders_dataset.csv"
    - "olist_order_items_dataset.csv"
    - "olist_order_payments_dataset.csv"
    - "olist_order_reviews_dataset.csv"
    - "olist_customers_dataset.csv"
    - "olist_sellers_dataset.csv"
    - "olist_products_dataset.csv"
    - "olist_geolocation_dataset.csv"
    - "product_category_name_translation.csv"

machine_learning:
  random_seed: 42
  target: "is_late_delivery"
  baseline_model: "LogisticRegression"
  candidate_models:
    - "RandomForestClassifier"
    - "GradientBoostingClassifier"
